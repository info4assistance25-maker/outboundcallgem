<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3dc8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GEM Outbound" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>GEM Group — Campagne Outbound</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <!-- Widget chat assistenza Wildix Kite (AssistenzaChatbot) -->
    <script>
      (function(d,t) {
        var BASE_URL='https://app.x-bees.com';
        var e=d.createElement(t),s=d.getElementsByTagName(t)[0];
        e.src=BASE_URL+'/kite/widget.js';
        e.defer=true;
        e.async=true;
        s.parentNode.insertBefore(e, s);
        e.onload=function(){
          window.wxSDK.run({
            kiteId: 'quuqlfkb',
            baseUrl: BASE_URL,
          });
        };
      })(document,'script');
    </script>
  </body>
</html>
